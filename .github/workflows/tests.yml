name: Run OCI Bot

on:
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Create Private Key File
        run: |
          cat << 'EOF' > /tmp/oracle_key.pem
          ${{ secrets.OCI_PRIVATE_KEY }}
          EOF
          chmod 600 /tmp/oracle_key.pem

      - name: Run Debug Script
        run: php debug.php
        env:
          OCI_REGION: eu-frankfurt-1
          OCI_USER_ID: ${{ secrets.OCI_USER_OCID }}
          OCI_TENANCY_ID: ${{ secrets.OCI_TENANCY_OCID }}
          OCI_KEY_FINGERPRINT: ${{ secrets.OCI_FINGERPRINT }}
          OCI_PRIVATE_KEY_FILENAME: /tmp/oracle_key.pem
          OCI_SUBNET_ID: ${{ secrets.OCI_SUBNET_OCID }}
